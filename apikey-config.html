<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar API Key - DeepSeek</title>
    <style>
        body {
            font-family: 'Segoe UI', Ubuntu, Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            color: #333;
        }
        h1 {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 10px;
        }
        p {
            margin: 20px 0;
            color: #666;
        }
        .input-group {
            margin: 25px 0;
        }
        input {
            width: 100%;
            padding: 12px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 12px 30px;
            font-size: 1em;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        .secondary-btn {
            background: #6c757d;
        }
        .secondary-btn:hover {
            box-shadow: 0 4px 12px rgba(108, 117, 125, 0.4);
        }
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border-radius: 4px;
        }
        .info-box strong {
            color: #667eea;
        }
        .info-box a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .info-box a:hover {
            text-decoration: underline;
        }
        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 DeepSeek API Configuration</h1>
        <p>Configure sua API key para usar o DeepSeek Desktop</p>

        <div class="info-box">
            <strong>Como obter sua API key:</strong><br>
            1. Acesse <a href="#" onclick="openExternal('https://platform.deepseek.com/api_keys'); return false;">platform.deepseek.com</a><br>
            2. Faça login ou crie uma conta<br>
            3. Copie sua API key
        </div>

        <div class="input-group">
            <input type="password" id="apiKeyInput" placeholder="Cole sua API key aqui (sk-...)" />
        </div>

        <button onclick="saveApiKey()">Salvar e Continuar</button>
        <button class="secondary-btn" onclick="testApiKey()">Testar API Key</button>

        <div id="message"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        function openExternal(url) {
            ipcRenderer.send('open-external-link', url);
        }

        function showMessage(text, isError = false) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = text;
            msgDiv.className = isError ? 'error' : 'success';
            msgDiv.style.display = 'block';

            setTimeout(() => {
                msgDiv.style.display = 'none';
            }, 5000);
        }

        async function testApiKey() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();

            if (!apiKey) {
                showMessage('Por favor, insira uma API key', true);
                return;
            }

            if (!apiKey.startsWith('sk-')) {
                showMessage('API key inválida. Deve começar com "sk-"', true);
                return;
            }

            showMessage('Testando API key...');

            const result = await ipcRenderer.invoke('test-api-key', apiKey);

            if (result.success) {
                showMessage('✓ API key válida! Salvando...');
                setTimeout(() => saveApiKey(), 1000);
            } else {
                showMessage('✗ Erro: ' + result.error, true);
            }
        }

        function saveApiKey() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();

            if (!apiKey) {
                showMessage('Por favor, insira uma API key', true);
                return;
            }

            if (!apiKey.startsWith('sk-')) {
                showMessage('API key inválida. Deve começar com "sk-"', true);
                return;
            }

            ipcRenderer.send('save-api-key', apiKey);
            showMessage('✓ API key salva! Redirecionando...');
        }

        // Listen for save confirmation
        ipcRenderer.on('api-key-saved', () => {
            showMessage('✓ Configuração concluída!');
        });

        // Check if API key already exists
        window.addEventListener('DOMContentLoaded', async () => {
            const hasApiKey = await ipcRenderer.invoke('check-api-key');
            if (hasApiKey) {
                const useExisting = confirm('Já existe uma API key salva. Deseja usar a existente?');
                if (useExisting) {
                    ipcRenderer.send('load-chat');
                }
            }
        });
    </script>
</body>
</html>
